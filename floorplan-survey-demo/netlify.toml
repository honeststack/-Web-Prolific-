[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The survey is a single-page app: every non-file path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Dummy floor plans never change for a given path.
[[headers]]
  for = "/RPLAN_triplets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
